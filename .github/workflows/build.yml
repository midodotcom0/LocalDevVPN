name: Build Exact LocalDevVPN IPA

on:
    pull_request:
        branches: [buildbase-localdevvpn-b79d4bf]

permissions:
    contents: read

jobs:
    build:
        runs-on: macos-latest

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Install ldid
              run: brew install ldid

            - name: Select Xcode 26.6
              uses: maxim-lobanov/setup-xcode@v1
              with:
                  xcode-version: '26.6'

            - name: Build Xcode Archive
              run: |
                  xcodebuild archive \
                    -project LocalDevVPN.xcodeproj \
                    -scheme LocalDevVPN \
                    -destination 'generic/platform=iOS' \
                    -archivePath build/LocalDevVPN.xcarchive \
                    CODE_SIGN_IDENTITY="" \
                    CODE_SIGNING_REQUIRED=NO \
                    CODE_SIGNING_ALLOWED=NO

            - name: Create Payload directory
              run: mkdir -p Payload

            - name: Copy App to Payload
              run: cp -R build/LocalDevVPN.xcarchive/Products/Applications/LocalDevVPN.app Payload/LocalDevVPN.app

            - name: Find and Sign App Extension
              run: |
                  APPEX_PATH=$(find Payload/LocalDevVPN.app/PlugIns -name "*.appex" | head -n 1)
                  if [ -z "$APPEX_PATH" ]; then
                    echo "Error: App Extension (.appex) not found in PlugIns directory."
                    exit 1
                  fi
                  ldid -S"${GITHUB_WORKSPACE}/TunnelProv/TunnelProv.entitlements" "$APPEX_PATH/$(basename "$APPEX_PATH" .appex)"

            - name: Sign Main App Bundle
              run: |
                  ldid -S"${GITHUB_WORKSPACE}/LocalDevVPN/LocalDevVPN.entitlements" Payload/LocalDevVPN.app/LocalDevVPN

            - name: Create IPA
              run: zip -r LocalDevVPN-working-lan-session.ipa Payload

            - name: Upload IPA Artifact
              uses: actions/upload-artifact@v4
              with:
                  name: LocalDevVPN-working-lan-session
                  path: LocalDevVPN-working-lan-session.ipa
                  retention-days: 30
