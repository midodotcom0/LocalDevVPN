name: Build Locus Two-Button IPA

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/build-locus-two-buttons.yml
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 45

    steps:
      - name: Check out workflow repository
        uses: actions/checkout@v4

      - name: Check out Locus
        uses: actions/checkout@v4
        with:
          repository: ChrisMack32/Locus
          ref: 83c8fb324983728e8f44759cfd834dc637ee38b5
          path: LocusSource

      - name: Patch controls to keep Teleport and Stop separate
        shell: python3 {0}
        run: |
          from pathlib import Path

          path = Path("LocusSource/Locus/Features/Map/RootView.swift")
          text = path.read_text()
          old = '''                if session.isSpoofing {
                    Button {
                        session.stop(pairing: pairing)
                    } label: {
                        Text("Stop")
                            .font(.subheadline.weight(.bold))
                            .foregroundStyle(.white)
                            .frame(minWidth: 72)
                            .padding(.vertical, 12)
                            .padding(.horizontal, 8)
                            .background(Capsule().fill(LocusTheme.danger))
                            .contentShape(Capsule())
                    }
                    .buttonStyle(.plain)
                } else {
                    Button {
                        guard let pin = session.pin else {
                            session.lastError = "Tap the map to drop a pin first."
                            return
                        }
                        session.teleport(to: pin, pairing: pairing)
                    } label: {
                        Text("Teleport")
                            .font(.subheadline.weight(.bold))
                            .foregroundStyle(.black)
                            .frame(minWidth: 96)
                            .padding(.vertical, 12)
                            .padding(.horizontal, 10)
                            .background(Capsule().fill(LocusTheme.accent))
                            .contentShape(Capsule())
                    }
                    .buttonStyle(.plain)
                    .disabled(session.isBusy)
                }
'''
          new = '''                Button {
                    guard let pin = session.pin else {
                        session.lastError = "Tap the map to drop a pin first."
                        return
                    }
                    session.teleport(to: pin, pairing: pairing)
                } label: {
                    Text("Teleport")
                        .font(.subheadline.weight(.bold))
                        .foregroundStyle(.black)
                        .frame(maxWidth: .infinity)
                        .padding(.vertical, 12)
                        .padding(.horizontal, 8)
                        .background(Capsule().fill(LocusTheme.accent))
                        .contentShape(Capsule())
                }
                .buttonStyle(.plain)
                .disabled(session.isBusy || session.pin == nil)

                Button {
                    session.stop(pairing: pairing)
                } label: {
                    Text("Stop")
                        .font(.subheadline.weight(.bold))
                        .foregroundStyle(.white)
                        .frame(minWidth: 64)
                        .padding(.vertical, 12)
                        .padding(.horizontal, 8)
                        .background(
                            Capsule().fill(
                                session.isSpoofing
                                    ? LocusTheme.danger
                                    : Color.primary.opacity(0.16)
                            )
                        )
                        .contentShape(Capsule())
                }
                .buttonStyle(.plain)
                .disabled(session.isBusy || !session.isSpoofing)
'''
          if old not in text:
              raise SystemExit("Expected controls block was not found")
          path.write_text(text.replace(old, new, 1))

      - name: Select newest Xcode
        shell: bash
        run: |
          set -euo pipefail
          XCODE_APP="$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"
          sudo xcode-select -s "$XCODE_APP/Contents/Developer"
          xcodebuild -version

      - name: Install XcodeGen
        shell: bash
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: LocusSource
        shell: bash
        run: xcodegen generate

      - name: Build unsigned app
        working-directory: LocusSource
        shell: bash
        run: |
          set -o pipefail
          xcodebuild \
            -project Locus.xcodeproj \
            -scheme Locus \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/LocusDerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY='' \
            build | tee "$RUNNER_TEMP/locus-build.log"

      - name: Package IPA
        shell: bash
        run: |
          set -euo pipefail
          APP_PATH="$(find "$RUNNER_TEMP/LocusDerivedData/Build/Products/Release-iphoneos" -maxdepth 1 -name '*.app' -print -quit)"
          test -n "$APP_PATH"
          rm -rf Payload
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          /usr/bin/zip -qry Locus-Two-Buttons-unsigned.ipa Payload
          test -s Locus-Two-Buttons-unsigned.ipa

      - name: Upload IPA
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Locus-Two-Buttons-unsigned-IPA
          path: Locus-Two-Buttons-unsigned.ipa
          if-no-files-found: error
          retention-days: 30

      - name: Publish build result in repository
        if: always() && github.event_name == 'push'
        env:
          BUILD_RESULT: ${{ job.status }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          printf '%s\n' "$BUILD_RESULT" > artifacts/locus-two-buttons-status.txt
          if [ -f Locus-Two-Buttons-unsigned.ipa ]; then
            cp Locus-Two-Buttons-unsigned.ipa artifacts/Locus-Two-Buttons-unsigned.ipa
          fi
          if [ -f "$RUNNER_TEMP/locus-build.log" ]; then
            tail -n 300 "$RUNNER_TEMP/locus-build.log" > artifacts/locus-two-buttons-build-tail.txt
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add artifacts/
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Publish Locus two-button build result"
          git push origin HEAD:main
